name: release

# Publishes to npm with a provenance attestation, using npm trusted publishing
# (OIDC). There is deliberately no NPM_TOKEN: the workflow proves its identity
# to the registry with a short-lived OIDC token that cannot be exfiltrated or
# replayed, and npm generates provenance automatically as a result. The
# trusted publisher is configured on npmjs.com against this exact filename —
# renaming this file breaks publishing until it is reconfigured there.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm cannot verify the workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the runner ships something
      # older, and a stale npm fails with an auth error that reads like a
      # permissions problem rather than a version one.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          V=$(npm --version); echo "npm $V"
          node -e '
            const [a,b,c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error(`npm >= 11.5.1 required for trusted publishing, got ${process.argv[1]}`); process.exit(1); }
          ' "$V"

      - run: npm ci

      # The same gate CI runs on every push — typecheck, build, tests, and the
      # exact-file tarball manifest. A release must not be the first time these
      # run against this tree.
      - run: npm run verify

      # A release tagged v0.2.0 that ships package.json 0.1.0 is a silent
      # mis-publish, and the version can never be reused. Refuse instead.
      - name: Tag must match package.json version
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          echo "package.json=$PKG  tag=$TAG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }

      # A dry run against the current version always hits "cannot publish over
      # the previously published version", because that version is by
      # definition already out. That specific rejection is the good outcome: it
      # proves the trusted-publisher handshake authenticated and the registry
      # resolved the package. Anything else — a 401, a 403, a packaging error —
      # is a real failure and must still fail the job.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          set +e
          OUT=$(npm publish --dry-run 2>&1); CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            echo "::notice::Dry run clean — this version is not yet published."
            exit 0
          fi
          if echo "$OUT" | grep -q "cannot publish over the previously published versions"; then
            echo "::notice::Registry authenticated and rejected only because this version already exists — the trusted-publisher link is working."
            exit 0
          fi
          echo "::error::Dry run failed for a reason other than the version already existing."
          exit $CODE

      # No --provenance flag and no token: trusted publishing attaches the
      # attestation on its own.
      - name: Publish to npm
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --access public
