name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, and explicit rather than inherited: this job only reads the
# tree. A public repo runs this workflow for every fork's pull request, so the
# token it hands out should be able to do nothing else even if a dependency in
# the install step turns hostile.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Patched releases on the Node2Shell floor (CVE-2026-111497). Node 20
        # is EOL and below that floor, so it is not in this matrix. Keep the
        # patch numbers: a bare major would float onto an unpatched release.
        node: [22.23.4, 24.22.1, 26.12.1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Node floor (CVE-2026-111497)
        run: node -e 'const [a,b,c]=process.versions.node.split(".").map(Number);const f={22:[23,4],24:[22,1],26:[12,1]}[a];if(!f||b<f[0]||(b===f[0]&&c<f[1])){console.error("Node "+process.version+" below Node2Shell floor");process.exit(1)}'
      - run: npm ci
      - run: npm run typecheck
      # Build FIRST: the adversarial suite's built-artifact block is guarded by
      # existsSync(dist/cli.js), so testing before building skipped the real
      # CLI and MCP stdio tests in CI entirely — the claim that they run was
      # true locally and false on a clean checkout.
      - run: npm run build
      - run: npm test
      # `npm pack --dry-run` only previews — it asserts nothing, and stayed
      # green while package.json#files omitted the docs. This checks the real
      # file list against an allowlist: docs present, no model data, nothing
      # unexpected.
      - run: node scripts/check-pack.mjs
