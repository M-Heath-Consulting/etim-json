name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, and explicit rather than inherited: this job only reads the
# tree. A public repo runs this workflow for every fork's pull request, so the
# token it hands out should be able to do nothing else even if a dependency in
# the install step turns hostile.
permissions:
  contents: read

# Cancel superseded PR checks; other events retain independent runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Patched releases on the Node2Shell floor (CVE-2026-111497). Node 20
        # is EOL and below that floor, so it is not in this matrix. Keep the
        # patch numbers: a bare major would float onto an unpatched release.
        node: [22.23.4, 24.22.1, 26.12.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Node floor (CVE-2026-111497)
        run: node -e 'const [a,b,c]=process.versions.node.split(".").map(Number);const f={22:[23,4],24:[22,1],26:[12,1]}[a];if(!f||b<f[0]||(b===f[0]&&c<f[1])){console.error("Node "+process.version+" below Node2Shell floor");process.exit(1)}'
      - run: npm ci
      - run: npm run typecheck
      # Build FIRST: the adversarial suite's built-artifact block is guarded by
      # existsSync(dist/cli.js), so testing before building skipped the real
      # CLI and MCP stdio tests in CI entirely — the claim that they run was
      # true locally and false on a clean checkout.
      - run: npm run build
      - run: npm test
      # `npm pack --dry-run` only previews — it asserts nothing, and stayed
      # green while package.json#files omitted the docs. This checks the real
      # file list against an allowlist: docs present, no model data, nothing
      # unexpected.
      - run: node scripts/check-pack.mjs

  # Single stable check for the ruleset to require: the matrix check names
  # carry the Node version and change with every Node patch bump; this one
  # does not. Runs even when a leg fails or is cancelled, and passes only if
  # every job in `needs` succeeded.
  verify-required:
    name: verify
    if: always()
    needs:
      - verify
    permissions: {}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS_JSON"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS_JSON" > /dev/null; then
            echo "::error::A required job did not succeed; see the results above."
            exit 1
          fi
