name: Bug report
description: Something behaves differently from what the docs or types promise
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste ETIM classification data into an issue — it is
        licensed to you, not to this repository. A class code and the shape of
        the problem is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Smallest way to reproduce it
      description: A command, or a few lines against the demo model (`etim-json demo -o m.json`).
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: etim-json version
      placeholder: "0.1.0"
    validations: { required: true }
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "22.x"
    validations: { required: true }
