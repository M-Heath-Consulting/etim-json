name: Feature request
description: Something the format, CLI or MCP server should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you are trying to solve
      description: What you are doing today, and where it falls down.
    validations: { required: true }
  - type: textarea
    id: shape
    attributes:
      label: What a good solution might look like
    validations: { required: false }
