# Weekly grouped version updates. Cooldown does not apply to security updates.
# Major updates remain separate; no dependency PR is auto-merged.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    dev-dependencies:
      dependency-type: development
    production-dependencies:
      dependency-type: production
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
